name: Deploy integration (/int/)

# Every commit on main publishes to the /int/ context path on GitHub Pages.
on:
  push:
    branches: [main]

permissions:
  contents: write # push to the gh-pages branch

concurrency:
  # Serialize gh-pages writes so int and release/pr deploys never race the branch.
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  deploy-int:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Base prefix = where the Pages SITE root lives.
      #   Project page (default): /<repo>/    e.g. /ghpages-context-demo/
      #   Custom domain or user page: set repo variable PAGES_BASE_PREFIX to "/"
      # Switching to a custom domain later is a one-line change: set that variable to "/".
      - name: Resolve base prefix
        id: base
        run: |
          PREFIX="${{ vars.PAGES_BASE_PREFIX }}"
          if [ -z "$PREFIX" ]; then PREFIX="/${{ github.event.repository.name }}/"; fi
          echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"
          echo "href=${PREFIX}int/" >> "$GITHUB_OUTPUT"

      - name: Write build-info.json
        run: |
          cat > public/build-info.json <<JSON
          {
            "environment": "integration",
            "contextPath": "${{ steps.base.outputs.href }}",
            "gitRef": "${{ github.ref_name }}",
            "gitSha": "${{ github.sha }}",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "prNumber": ""
          }
          JSON

      - name: Build
        run: npx ng build --configuration production --base-href "${{ steps.base.outputs.href }}"

      # Publish with plain git (no third-party action). We check out the gh-pages branch,
      # replace ONLY the int/ subfolder, and push. Sibling paths (root prod, pr-*/) are never
      # touched, which is the same guarantee peaceiris' keep_files gave us.
      - name: Publish to gh-pages:/int
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_DIR: ./dist/ghpages-context-demo/browser
          TARGET: int
          BASE_PREFIX: ${{ steps.base.outputs.prefix }}
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          rm -rf gh-pages-publish
          if git ls-remote --exit-code --heads "$REMOTE" gh-pages >/dev/null 2>&1; then
            git clone --branch gh-pages --single-branch "$REMOTE" gh-pages-publish
          else
            git clone "$REMOTE" gh-pages-publish
            (cd gh-pages-publish && git checkout --orphan gh-pages && git rm -rf . >/dev/null 2>&1 || true)
          fi
          touch gh-pages-publish/.nojekyll
          rm -rf "gh-pages-publish/${TARGET}"
          mkdir -p "gh-pages-publish/${TARGET}"
          cp -R "${BUILD_DIR}/." "gh-pages-publish/${TARGET}/"
          # Publish the context-aware ROOT 404. GitHub Pages serves only the site-root 404 for
          # any miss (including /int/... and /pr-N/...), so this router lives at the branch root
          # and dispatches to the right context index. Refreshed here so deep links work before
          # any production release exists. __REPO_BASE__ = the site base prefix.
          sed "s#__REPO_BASE__#${BASE_PREFIX}#g" "${GITHUB_WORKSPACE}/.github/pages/root-404.html" > gh-pages-publish/404.html
          cd gh-pages-publish
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "deploy: integration ${GITHUB_SHA} to /int/ (+ root 404 router)"
            git push origin gh-pages
          fi
