name: Article from issue → PR into news-content

# A PM submits the "New article" issue form. On label, this workflow turns the issue
# into a well-formatted Markdown post (+ downloaded thumbnail) and opens a PULL REQUEST
# into the orphan `news-content` branch. A maintainer reviews and merges that PR — the
# merge is the human gate AND the trigger for publish-news.yml.
#
# This workflow lives on the DEFAULT branch (where issue templates and issue-triggered
# workflows must live). It only ever writes to a feature branch + opens a PR; it never
# pushes to news-content or gh-pages directly.

on:
  issues:
    types: [opened, edited, labeled, reopened]

permissions:
  contents: write # push the article branch
  pull-requests: write # open the PR
  issues: write # comment back on the issue

concurrency:
  # One run per issue; a re-edit supersedes an in-flight run for the same issue.
  group: article-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  generate:
    # Only act on issues carrying the news-article label.
    if: contains(join(github.event.issue.labels.*.name, ','), 'news-article')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch (for the scripts)
        uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Write issue body to a file
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: printf '%s' "$ISSUE_BODY" > issue-body.md

      - name: Parse issue → Markdown post
        id: parse
        run: |
          set -euo pipefail
          mkdir -p staging/_posts staging/assets
          RESULT=$(node news-content-scaffold/scripts/parse-issue.mjs issue-body.md staging/_posts)
          echo "result=$RESULT" >> "$GITHUB_OUTPUT"
          echo "$RESULT" > parse-result.json
          echo "slug=$(node -e 'console.log(require("./parse-result.json").slug)')" >> "$GITHUB_OUTPUT"
          echo "imageUrl=$(node -e 'console.log(require("./parse-result.json").imageUrl||"")')" >> "$GITHUB_OUTPUT"

      - name: Download thumbnail (if provided) and finalize extension
        id: thumb
        env:
          IMAGE_URL: ${{ steps.parse.outputs.imageUrl }}
          SLUG: ${{ steps.parse.outputs.slug }}
        run: |
          set -euo pipefail
          if [ -z "${IMAGE_URL}" ]; then
            echo "No thumbnail provided."; exit 0
          fi
          # Download; sniff the real content-type so a PM PNG/JPG/WebP all land correctly.
          curl -sSL -D headers.txt -o thumb.bin "${IMAGE_URL}"
          CT=$(grep -i '^content-type:' headers.txt | tail -1 | tr -d '\r' | awk '{print tolower($2)}')
          case "$CT" in
            image/png) EXT=png ;;
            image/jpeg) EXT=jpg ;;
            image/webp) EXT=webp ;;
            image/gif) EXT=gif ;;
            image/avif) EXT=avif ;;
            image/svg+xml) EXT=svg ;;
            *) EXT="${IMAGE_URL##*.}"; EXT="${EXT%%\?*}"; EXT="${EXT:-png}" ;;
          esac
          cp thumb.bin "staging/assets/${SLUG}.${EXT}"
          # Make sure frontmatter points at the real extension.
          sed -i "s#^thumbnail:.*#thumbnail: news-data/assets/${SLUG}.${EXT}#" "staging/_posts/${SLUG}.md" || true
          if ! grep -q '^thumbnail:' "staging/_posts/${SLUG}.md"; then
            sed -i "0,/^---$/!{/^tags:/a thumbnail: news-data/assets/${SLUG}.${EXT}
            }" "staging/_posts/${SLUG}.md" || true
          fi
          echo "ext=${EXT}" >> "$GITHUB_OUTPUT"

      - name: Open PR into news-content
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLUG: ${{ steps.parse.outputs.slug }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # The base branch MUST already exist (seed it once — see the scaffold README).
          if ! git ls-remote --exit-code --heads "$REMOTE" news-content >/dev/null 2>&1; then
            gh issue comment "$ISSUE" --body "⚠️ The \`news-content\` branch does not exist yet. A maintainer must seed it before articles can be generated (see \`news-content-scaffold/README.md\`)."
            exit 1
          fi

          rm -rf nc && git clone --branch news-content --single-branch "$REMOTE" nc
          mkdir -p nc/_posts nc/assets
          cp "staging/_posts/${SLUG}.md" "nc/_posts/${SLUG}.md"
          if ls staging/assets/"${SLUG}".* >/dev/null 2>&1; then
            cp staging/assets/"${SLUG}".* nc/assets/
          fi

          cd nc
          BRANCH="article/${SLUG}-issue-${ISSUE}"
          git checkout -b "$BRANCH"
          git add -A
          if git diff --cached --quiet; then
            echo "No content changes."; exit 0
          fi
          git commit -m "article: ${SLUG} (from issue #${ISSUE})"
          git push -f origin "$BRANCH"

          # Create-or-update the PR into news-content.
          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            echo "PR already exists for $BRANCH."
          else
            gh pr create \
              --base news-content \
              --head "$BRANCH" \
              --title "📰 ${SLUG} (issue #${ISSUE})" \
              --body "Auto-generated from issue #${ISSUE}. Review the Markdown, then **merge to publish** (the merge triggers the live deploy). Closes #${ISSUE}."
          fi

      - name: Comment the result on the issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          SLUG: ${{ steps.parse.outputs.slug }}
        run: |
          gh issue comment "$ISSUE" --body "✅ Generated article \`${SLUG}\` and opened a review PR into \`news-content\`. Merging it publishes the post." || true
