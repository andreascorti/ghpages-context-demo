name: PR preview cleanup

# When a PR closes (merged or not), remove its /pr-<number>/ folder from the gh-pages branch.
on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  cleanup-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Remove /pr-<n>/ folder
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -d "pr-${PR}" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git rm -r "pr-${PR}"
            git commit -m "cleanup: remove preview pr-${PR}"
            git push origin gh-pages
            echo "removed=true" >> "$GITHUB_ENV"
          else
            echo "No pr-${PR} folder to remove."
            echo "removed=false" >> "$GITHUB_ENV"
          fi

      - name: Update PR comment
        if: env.removed == 'true'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          number: ${{ github.event.pull_request.number }}
          header: pr-preview
          message: |
            🧹 Preview for `/pr-${{ github.event.pull_request.number }}/` has been removed (PR closed).
