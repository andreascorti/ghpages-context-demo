name: PR preview cleanup

# When a PR closes (merged or not), remove its /pr-<number>/ folder from the gh-pages branch.
on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  cleanup-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Remove /pr-<n>/ folder
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -d "pr-${PR}" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git rm -r "pr-${PR}"
            git commit -m "cleanup: remove preview pr-${PR}"
            git push origin gh-pages
            echo "removed=true" >> "$GITHUB_ENV"
          else
            echo "No pr-${PR} folder to remove."
            echo "removed=false" >> "$GITHUB_ENV"
          fi

      - name: Update PR comment
        if: env.removed == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const prNumber = Number('${{ github.event.pull_request.number }}');
            const marker = '<!-- pr-preview -->';
            const body = [
              marker,
              `🧹 Preview for PR #${prNumber} has been removed (PR closed).`,
            ].join('\n');

            const { owner, repo } = context.repo;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: prNumber, per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
            }
