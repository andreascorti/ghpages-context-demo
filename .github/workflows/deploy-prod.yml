name: Deploy production (root)

# Production is served at the site ROOT (no dedicated folder), published from release
# branches with immutable releases. A push to release/** OR a semver tag triggers it.
on:
  push:
    branches: ['release/**']
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Resolve base prefix
        id: base
        run: |
          PREFIX="${{ vars.PAGES_BASE_PREFIX }}"
          if [ -z "$PREFIX" ]; then PREFIX="/${{ github.event.repository.name }}/"; fi
          echo "href=$PREFIX" >> "$GITHUB_OUTPUT"

      - name: Write build-info.json
        run: |
          cat > public/build-info.json <<JSON
          {
            "environment": "production",
            "contextPath": "${{ steps.base.outputs.href }}",
            "gitRef": "${{ github.ref_name }}",
            "gitSha": "${{ github.sha }}",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "prNumber": ""
          }
          JSON

      - name: Build (production lives at the site root = base prefix)
        run: npx ng build --configuration production --base-href "${{ steps.base.outputs.href }}"

      # Publish with plain git (no third-party action). Production lives at the branch ROOT.
      # We replace only the root-level FILES (index.html, JS, css, 404.html, ...) and never
      # delete directories, so /int/ and every /pr-*/ preview survive a production deploy.
      - name: Publish to gh-pages root
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_DIR: ./dist/ghpages-context-demo/browser
          BASE_PREFIX: ${{ steps.base.outputs.href }}
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          rm -rf gh-pages-publish
          if git ls-remote --exit-code --heads "$REMOTE" gh-pages >/dev/null 2>&1; then
            git clone --branch gh-pages --single-branch "$REMOTE" gh-pages-publish
          else
            git clone "$REMOTE" gh-pages-publish
            (cd gh-pages-publish && git checkout --orphan gh-pages && git rm -rf . >/dev/null 2>&1 || true)
          fi
          # Remove existing root-level files only (keep .git and all subdirectories intact).
          find gh-pages-publish -maxdepth 1 -type f ! -name '.nojekyll' -delete
          touch gh-pages-publish/.nojekyll
          # Copy build output into root (files land at root; the build has no subdirs to clash).
          cp -R "${BUILD_DIR}/." "gh-pages-publish/"
          # Overwrite the root 404 with the CONTEXT-AWARE router. GitHub Pages serves only the
          # site-root 404 for every miss (including /int/... and /pr-N/...), so root must route
          # all contexts, not just production routes. __REPO_BASE__ = the site base prefix.
          sed "s#__REPO_BASE__#${BASE_PREFIX}#g" "${GITHUB_WORKSPACE}/.github/pages/root-404.html" > gh-pages-publish/404.html
          cd gh-pages-publish
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "deploy: production ${GITHUB_REF_NAME} (${GITHUB_SHA})"
            git push origin gh-pages
          fi
