name: PR CI (build preview artifact)

# Runs on every PR. Builds the app for a /pr-<number>/ context path and uploads it as an
# artifact. Deliberately has NO write permissions so it is safe for fork PRs; the actual
# gh-pages deploy + PR comment happens in pr-preview-deploy.yml via workflow_run.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build check & unit tests
        run: |
          npx ng build --configuration development >/dev/null # fast type/build check
          npx ng test # Vitest builder runs once and exits under CI

      - name: Resolve base prefix
        id: base
        run: |
          PREFIX="${{ vars.PAGES_BASE_PREFIX }}"
          if [ -z "$PREFIX" ]; then PREFIX="/${{ github.event.repository.name }}/"; fi
          echo "href=${PREFIX}pr-${{ github.event.pull_request.number }}/" >> "$GITHUB_OUTPUT"

      - name: Write build-info.json
        run: |
          cat > public/build-info.json <<JSON
          {
            "environment": "pr-preview",
            "contextPath": "${{ steps.base.outputs.href }}",
            "gitRef": "${{ github.head_ref }}",
            "gitSha": "${{ github.event.pull_request.head.sha }}",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "prNumber": "${{ github.event.pull_request.number }}"
          }
          JSON

      - name: Build
        run: npx ng build --configuration production --base-href "${{ steps.base.outputs.href }}"

      - name: Record PR metadata for the deploy workflow
        # In a SEPARATE dir (not the build output) with NON-hidden filenames. upload-artifact v4+
        # excludes hidden files by default, so dotfile markers inside the build dir were silently
        # dropped, arriving empty at the deploy. Plain files in their own artifact avoid both the
        # hidden-file exclusion and any risk of the markers shipping to gh-pages.
        run: |
          mkdir -p pr-meta
          echo "${{ github.event.pull_request.number }}" > pr-meta/pr-number.txt
          echo "${{ github.event.pull_request.head.sha }}" > pr-meta/pr-head-sha.txt

      - name: Upload preview artifact
        uses: actions/upload-artifact@v7
        with:
          name: pr-preview
          path: ./dist/ghpages-context-demo/browser
          retention-days: 5

      - name: Upload PR metadata artifact
        uses: actions/upload-artifact@v7
        with:
          name: pr-meta
          path: ./pr-meta
          retention-days: 5
