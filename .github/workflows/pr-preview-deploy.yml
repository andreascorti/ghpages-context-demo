name: PR preview deploy + comment

# Triggered when "PR CI (build preview artifact)" finishes. Runs in the BASE repo context
# with write permissions, so it works even for fork PRs (the pull_request build itself is
# unprivileged). Downloads the artifact, publishes it to gh-pages:/pr-<n>/, and comments.
on:
  workflow_run:
    workflows: ['PR CI (build preview artifact)']
    types: [completed]

permissions:
  contents: write # push to gh-pages
  pull-requests: write # comment on the PR
  actions: read # download the artifact
  statuses: write # post the preview-deploy commit status on the PR

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  deploy-preview:
    # Only for CI runs that were themselves triggered by a pull_request. A workflow_run can
    # fire for other events (e.g. PR CI invoked outside a PR), where there is no PR number to
    # deploy or comment on — those must not reach the deploy/comment steps.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    # Maintainer approval gate: this environment must have "Required reviewers" configured
    # in Settings -> Environments -> pr-preview. The job PAUSES here until a maintainer
    # approves the run in the Actions UI, so no PR (including forks) deploys unreviewed.
    environment:
      name: pr-preview
      url: ${{ steps.url.outputs.url }}
    steps:
      - name: Download preview artifact
        uses: actions/download-artifact@v7
        with:
          name: pr-preview
          path: preview
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download PR metadata artifact
        uses: actions/download-artifact@v7
        with:
          name: pr-meta
          path: pr-meta
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve PR number and head SHA
        id: pr
        run: |
          set -euo pipefail
          NUM="$(cat pr-meta/pr-number.txt 2>/dev/null || true)"
          NUM="$(echo -n "$NUM" | tr -d '[:space:]')"
          SHA="$(cat pr-meta/pr-head-sha.txt 2>/dev/null || true)"
          SHA="$(echo -n "$SHA" | tr -d '[:space:]')"
          if ! echo "$NUM" | grep -qE '^[0-9]+$'; then
            # A workflow_run can fire for a CI run whose artifact carries no PR number (stale or
            # non-PR run). That is not an error — skip cleanly so the run is green, not red.
            echo "::notice::No numeric PR number in artifact ('$NUM') — skipping preview deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "number=" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "number=$NUM" >> "$GITHUB_OUTPUT"
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          fi

      # Publish with plain git (no third-party action). Replace ONLY the pr-<n>/ subfolder;
      # root prod, /int/ and sibling previews are never touched.
      - name: Publish to gh-pages:/pr-<n>/
        if: steps.pr.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_DIR: ./preview
          TARGET: pr-${{ steps.pr.outputs.number }}
          PAGES_BASE_PREFIX: ${{ vars.PAGES_BASE_PREFIX }}
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          BASE_PREFIX="${PAGES_BASE_PREFIX:-/${GITHUB_REPOSITORY##*/}/}"
          rm -rf gh-pages-publish
          if git ls-remote --exit-code --heads "$REMOTE" gh-pages >/dev/null 2>&1; then
            git clone --branch gh-pages --single-branch "$REMOTE" gh-pages-publish
          else
            git clone "$REMOTE" gh-pages-publish
            (cd gh-pages-publish && git checkout --orphan gh-pages && git rm -rf . >/dev/null 2>&1 || true)
          fi
          touch gh-pages-publish/.nojekyll
          rm -rf "gh-pages-publish/${TARGET}"
          mkdir -p "gh-pages-publish/${TARGET}"
          cp -R "${BUILD_DIR}/." "gh-pages-publish/${TARGET}/"
          # Ensure the context-aware root 404 exists so this preview's deep links resolve even if
          # no int/prod deploy has run yet. Only WRITE IF MISSING — never clobber a prod-published
          # root 404 (prod owns it; this is just a safety net for a preview-only site).
          if [ ! -f gh-pages-publish/404.html ]; then
            sed "s#__REPO_BASE__#${BASE_PREFIX}#g" "${GITHUB_WORKSPACE}/.github/pages/root-404.html" > gh-pages-publish/404.html
          fi
          cd gh-pages-publish
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "deploy: preview ${TARGET}"
            git push origin gh-pages
          fi

      - name: Compute preview URL
        id: url
        if: steps.pr.outputs.skip == 'false'
        run: |
          # Host + base prefix mirror the build config so the commented link is always correct:
          #   default (project page): https://<owner>.github.io/<repo>/pr-<n>/
          #   custom domain: set repo vars PAGES_HOST=https://your.domain and PAGES_BASE_PREFIX=/
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          HOST="${{ vars.PAGES_HOST }}"
          PREFIX="${{ vars.PAGES_BASE_PREFIX }}"
          if [ -z "$HOST" ]; then HOST="https://${OWNER}.github.io"; fi
          if [ -z "$PREFIX" ]; then PREFIX="/${REPO}/"; fi
          echo "url=${HOST}${PREFIX}pr-${{ steps.pr.outputs.number }}/" >> "$GITHUB_OUTPUT"

      - name: Comment preview link on the PR (create or update)
        if: steps.pr.outputs.skip == 'false'
        uses: actions/github-script@v9
        with:
          script: |
            const prNumber = Number('${{ steps.pr.outputs.number }}');
            const url = '${{ steps.url.outputs.url }}';
            const marker = '<!-- pr-preview -->';
            const body = [
              marker,
              '🚀 **Preview deployed** for this PR.',
              '',
              '| | |',
              '|---|---|',
              '| Environment | `pr-preview` |',
              `| Context path | \`${url}\` |`,
              `| URL | ${url} |`,
              '',
              'Updated on each push. Removed automatically when the PR closes.',
            ].join('\n');

            const { owner, repo } = context.repo;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: prNumber, per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
            }

      - name: Post preview deploy status on the PR commit
        if: steps.pr.outputs.skip == 'false' && steps.pr.outputs.sha != ''
        uses: actions/github-script@v9
        with:
          script: |
            // A workflow_run job does not attach its own check to the PR, so we set a COMMIT
            // STATUS on the PR head SHA. It appears in the PR's checks list with a link to the
            // live preview — a run check tied to the deploy, distinct from the comment.
            const { owner, repo } = context.repo;
            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: '${{ steps.pr.outputs.sha }}',
              state: 'success',
              context: 'preview / deploy',
              target_url: '${{ steps.url.outputs.url }}',
              description: 'Preview deployed',
            });
