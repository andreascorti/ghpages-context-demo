<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      // GitHub Pages SPA fallback for a context-path deploy.
      //
      // Each context (production /<repo>/, integration /<repo>/int/, preview /<repo>/pr-N/) is
      // its own build with its own <base href>. GH Pages serves the NEAREST 404.html up the tree,
      // so a hard refresh of /<repo>/int/items/42 is served by /<repo>/int/404.html.
      //
      // __SPA_BASE__ is replaced at build time with that context's base path (same value as the
      // Angular --base-href, e.g. "/ghpages-context-demo/int/"). We strip it off the requested
      // path, hand the remainder to index.html as an encoded query, and index.html restores it.
      // Adapted from rafgraph/spa-github-pages, generalized for nested context folders.
      (function () {
        var l = window.location;
        var base = '__SPA_BASE__'; // e.g. "/ghpages-context-demo/int/"
        var path = l.pathname;
        // Everything after the base is the in-app route.
        var route = path.indexOf(base) === 0 ? path.slice(base.length) : path.replace(/^\//, '');
        l.replace(
          l.protocol +
            '//' +
            l.hostname +
            (l.port ? ':' + l.port : '') +
            base +
            '?/' +
            route.replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash,
        );
      })();
    </script>
  </head>
  <body></body>
</html>
