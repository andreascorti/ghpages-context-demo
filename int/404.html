<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      // GitHub Pages SPA fallback.
      // GH Pages serves this 404.html for any unknown path. We rewrite the URL back to the
      // app's index while preserving the full path (including the context path such as
      // /int/ or /pr-123/) so the Angular router can handle client-side routes on refresh.
      // Technique adapted from rafgraph/spa-github-pages.
      (function () {
        var l = window.location;
        var segmentsToKeep = 0; // user/org pages served at domain root; adjust for project pages
        l.replace(
          l.protocol +
            '//' +
            l.hostname +
            (l.port ? ':' + l.port : '') +
            l.pathname
              .split('/')
              .slice(0, 1 + segmentsToKeep)
              .join('/') +
            '/?/' +
            l.pathname
              .slice(1)
              .split('/')
              .slice(segmentsToKeep)
              .join('/')
              .replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash
        );
      })();
    </script>
  </head>
  <body></body>
</html>
